version: v0.3

# Niffy development Recipe: all credentials are resolved from environment variables.

listeners:
  - name: niffy-http
    address: 0.0.0.0
    port: 8899
    timeout: 300s

global:
  services:
    router_replay:
      enabled: true
      store_backend: redis
      ttl_seconds: 604800
      async_writes: true
      redis:
        address: vllm-sr-redis:6379
        db: 2
        max_retries: 3
        pool_size: 10
        key_prefix: "niffy:replay:"
    startup_status:
      store_backend: redis
      redis:
        address: vllm-sr-redis:6379
        db: 3
    tenant_policy:
      enabled: true
      version: "2026-09-08"
      tenant_id_header: x-authz-tenant-id
      require_tenant: false
      currency: USD
      output_token_bound: 4096
      reasoning_token_bound: 8192
      require_pricing: true
      require_current_pricing: true
      default:
        allowed_providers: [mistral, xai, openai]
        max_estimated_cost: 0.20
      tenants:
        niffy-economy:
          denied_models: [niffy-reasoning]
          max_estimated_cost: 0.01
  model_catalog:
    embeddings:
      semantic:
        embedding_config:
          # Niffy uses per-signal calibrated thresholds and does not accept a
          # lower global soft-match fallback.
          enable_soft_matching: false
  router:
    auto_model_names:
      - niffy/auto
      - vllm-sr/auto

providers:
  defaults:
    # Unmatched and simple requests use the least-expensive model.
    default_model: niffy-cheap
    default_reasoning_effort: medium
    reasoning_families:
      openai:
        type: reasoning_effort
        parameter: reasoning_effort

  models:
    - name: niffy-cheap
      provider_model_id: mistral-small-latest
      api_format: openai
      pricing:
        version: "2026-09-03"
        source: https://docs.mistral.ai/inference/pricing
        unit: per_1m_tokens
        effective_at: "2026-09-03T00:00:00Z"
        expires_at: "2026-12-03T00:00:00Z"
        currency: USD
        prompt_per_1m: 0.15
        cached_input_per_1m: 0.015
        completion_per_1m: 0.60
      reliability:
        retry_count: 1
        retry_on: connect-failure,refused-stream,reset
        circuit_breaker_failures: 3
        circuit_breaker_open_time: 30s
      backend_refs:
        - name: mistral
          base_url: https://api.mistral.ai/v1
          # Mistral exposes an OpenAI-compatible Chat Completions API.
          provider: openai
          type: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: MISTRAL_API_KEY
          weight: 100

    - name: niffy-general
      provider_model_id: grok-4.3
      api_format: openai
      pricing:
        version: "2026-09-03"
        source: https://docs.x.ai/developers/migration/may-15-retirement
        unit: per_1m_tokens
        effective_at: "2026-09-03T00:00:00Z"
        expires_at: "2026-12-03T00:00:00Z"
        currency: USD
        prompt_per_1m: 1.25
        cached_input_per_1m: 0.20
        completion_per_1m: 2.50
      reliability:
        retry_count: 1
        retry_on: connect-failure,refused-stream,reset
        circuit_breaker_failures: 3
        circuit_breaker_open_time: 30s
      backend_refs:
        - name: xai
          base_url: https://api.x.ai/v1
          # xAI exposes an OpenAI-compatible Chat Completions API.
          provider: openai
          type: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: XAI_API_KEY
          weight: 100

    - name: niffy-reasoning
      reasoning_family: openai
      provider_model_id: gpt-5.6-terra
      api_format: openai
      pricing:
        version: "2026-09-03"
        source: https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6/
        unit: per_1m_tokens
        effective_at: "2026-09-03T00:00:00Z"
        expires_at: "2026-12-03T00:00:00Z"
        currency: USD
        prompt_per_1m: 2.00
        cached_input_per_1m: 0.20
        completion_per_1m: 12.00
      reliability:
        retry_count: 1
        retry_on: connect-failure,refused-stream,reset
        circuit_breaker_failures: 3
        circuit_breaker_open_time: 30s
      backend_refs:
        - name: openai
          base_url: https://api.openai.com/v1
          provider: openai
          type: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: OPENAI_API_KEY
          weight: 100

routing:
  strategy: priority

  modelCards:
    - name: niffy-cheap
      description: Economical default for direct questions, summaries, and routine chat.
      capabilities: [chat, text, summarization]
      modality: text
      tags: [provider:mistral, tier:cheap]
    - name: niffy-general
      description: General model selected when a request indicates live-search or tool intent.
      capabilities: [chat, text, tool_calling]
      modality: text
      tags: [provider:xai, tier:general]
    - name: niffy-reasoning
      description: Higher-cost model reserved for complex analysis and reasoning.
      capabilities: [chat, text, reasoning, code]
      modality: text
      tags: [provider:openai, tier:reasoning]

  signals:
    embeddings:
      - name: live_information_task
        threshold: 0.56
        aggregation_method: max
        candidates:
          - retrieve recent information from the internet before answering
          - verify a current claim using live external sources
          - find today's status, price, schedule, or breaking news
          - look up information that may have changed recently

    complexity:
      - name: reasoning_demand
        threshold: 0.10
        description: Calibrated local prototype margin for deliberate reasoning demand.
        hard:
          candidates:
            - compare multiple approaches and justify the tradeoffs
            - diagnose a complex failure from several interacting causes
            - derive a result step by step from first principles
            - synthesize constraints into an implementation architecture
        easy:
          candidates:
            - give a short direct factual answer
            - rewrite or translate one sentence
            - summarize a short paragraph briefly
            - provide a simple definition

    keywords:
      - name: tool_intent
        operator: OR
        case_sensitive: false
        keywords:
          - search the web
          - web search
          - browse the web
          - look online
          - find online
          - latest news
          - current news
          - current information
          - up-to-date
          - real-time
          - realtime
          - use a tool
          - call a tool
          - use mcp
          - mcp server

      - name: reasoning_intent
        operator: OR
        case_sensitive: false
        keywords:
          - analyze
          - reason through
          - step by step
          - prove
          - derive
          - calculate
          - debug
          - root cause
          - design an architecture
          - trade-off
          - tradeoff
          - compare approaches
          - optimize
          - multi-step
          - implementation plan

  decisions:
    # Tool intent has the highest priority so phrases such as "analyze the
    # latest news" select the provider intended for live-information work.
    - name: tool-intent-route
      description: Run authorized bounded web search, then synthesize with Grok.
      priority: 300
      required_capabilities: [chat, tool_calling]
      request_budget:
        currency: USD
        max_estimated_cost: 0.02
        output_token_bound: 2048
        require_pricing: true
        require_current_pricing: true
      workflow:
        type: web_search_answer
        authorization_group: web-search-users
        web_search:
          provider: searxng
          endpoint: ${NIFFY_WEB_SEARCH_ENDPOINT:-http://host.docker.internal:8888/search}
          timeout_seconds: 5
          max_results: 5
          max_query_characters: 500
          max_response_bytes: 262144
          max_evidence_characters: 8000
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: tool_intent
          - type: embedding
            name: live_information_task
      modelRefs:
        - model: niffy-general
          use_reasoning: false
      algorithm:
        type: static
      plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: false
            capture_response_body: false

    - name: reasoning-route
      description: Select OpenAI for requests likely to need deliberate reasoning.
      priority: 200
      required_capabilities: [chat, reasoning]
      request_budget:
        currency: USD
        max_estimated_cost: 0.25
        output_token_bound: 4096
        reasoning_token_bound: 4096
        require_pricing: true
        require_current_pricing: true
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: reasoning_intent
          - type: complexity
            name: reasoning_demand:hard
      modelRefs:
        - model: niffy-reasoning
          use_reasoning: true
          reasoning_effort: medium
      algorithm:
        type: static
      plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: false
            capture_response_body: false

    - name: economical-default-route
      description: Select Mistral for all requests not matched by a more specific route.
      priority: 100
      required_capabilities: [chat]
      request_budget:
        currency: USD
        max_estimated_cost: 0.01
        output_token_bound: 1024
        require_pricing: true
        require_current_pricing: true
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: niffy-cheap
          use_reasoning: false
        - model: niffy-general
          use_reasoning: false
      algorithm:
        type: fallback
        minimum_candidates: 2
        fallback:
          max_attempts: 2
          retry_on: [transport_error, timeout, rate_limited, server_error, invalid_response]
      plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: false
            capture_response_body: false
